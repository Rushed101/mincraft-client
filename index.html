<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astrix Client</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
html {
    scroll-behavior: smooth;
}
body {
    min-height: 100vh;
    background: #05070c;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}
body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(70, 55, 180, .18),
            transparent 45%
        ),
        radial-gradient(
            circle at 15% 80%,
            rgba(20, 100, 255, .08),
            transparent 30%
        );
}
/* =========================================================
   LANDING PAGE
========================================================= */
nav {
    position: relative;
    z-index: 10;
    height: 76px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(5, 7, 12, .9);
    border-bottom: 1px solid rgba(255,255,255,.07);
    backdrop-filter: blur(12px);
}
.logo {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: 2px;
}
.logo span {
    color: #4aa3ff;
}
.hero {
    position: relative;
    z-index: 2;
    min-height: calc(100vh - 76px);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 100px 20px 120px;
}
.badge {
    padding: 8px 16px;
    margin-bottom: 26px;
    border-radius: 999px;
    background: rgba(55,145,255,.08);
    border: 1px solid rgba(55,145,255,.25);
    color: #69b1ff;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
}
h1 {
    margin-bottom: 24px;
    font-size: clamp(48px, 9vw, 100px);
    line-height: .95;
    font-weight: 900;
    letter-spacing: -4px;
}
.blue {
    color: #4da6ff;
}
.description {
    max-width: 620px;
    margin-bottom: 36px;
    color: #8e98a8;
    font-size: 17px;
    line-height: 1.6;
}
.download {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 150px;
    padding: 15px 30px;
    border-radius: 10px;
    background: #2388ff;
    color: white;
    text-decoration: none;
    font-size: 16px;
    font-weight: 700;
    box-shadow:
        0 10px 35px rgba(35,136,255,.25);
    transition:
        transform .25s ease,
        background .25s ease,
        box-shadow .25s ease;
}
.download:hover {
    transform: translateY(-3px);
    background: #3995ff;
    box-shadow:
        0 15px 45px rgba(35,136,255,.4);
}
/* =========================================================
   GUI PREVIEW
========================================================= */
.gui-container {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 80px;
}

.preview-title {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #e0e0ff;
    margin-bottom: 22px;
    text-shadow: 0 0 20px rgba(120, 80, 255, 0.35);
}

.gui-preview {
    max-width: 920px;
    width: 100%;
    border-radius: 12px;
    border: 1px solid rgba(80, 70, 140, 0.45);
    box-shadow:
        0 35px 100px rgba(0,0,0,.7),
        0 0 80px rgba(80,50,180,.12);
    overflow: hidden;
}

.gui-preview img {
    width: 100%;
    height: auto;
    display: block;
}

/* =========================================================
   MOBILE
========================================================= */
@media (max-width: 540px) {
    .hero {
        padding-left: 10px;
        padding-right: 10px;
    }
    .preview-title {
        font-size: 22px;
    }
}
</style>
</head>
<body>
<nav>
    <div class="logo">
        <span>ASTRIX</span> CLIENT
    </div>
</nav>
<main class="hero">
    <div class="badge">
        MINECRAFT CLIENT
    </div>
    <h1>
        Built for <span class="blue">PvP</span>
    </h1>
    <p class="description">
        A powerful client designed for competitive Minecraft PvP.
    </p>
    <a
        class="download"
        href="https://github.com/Rushed101/mincraft-client/raw/refs/heads/main/astrixclient.exe"
        download="astrixclient.exe"
    >
        Jetzt Holen
    </a>

    <div class="gui-container">
        <div class="preview-title">Preview</div>
        <div class="gui-preview">
            <img src="dein-bild.png" alt="Astrix Client Preview">
        </div>
    </div>
</main>
</body>
</html>
