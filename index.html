<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astrix Client</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    background: #05070c;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(70, 55, 180, .18),
            transparent 45%
        ),
        radial-gradient(
            circle at 15% 80%,
            rgba(20, 100, 255, .08),
            transparent 30%
        );
}

/* =========================================================
   LANDING PAGE
========================================================= */

nav {
    position: relative;
    z-index: 10;

    height: 76px;
    width: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(5, 7, 12, .9);
    border-bottom: 1px solid rgba(255,255,255,.07);

    backdrop-filter: blur(12px);
}

.logo {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: 2px;
}

.logo span {
    color: #4aa3ff;
}

.hero {
    position: relative;
    z-index: 2;

    min-height: calc(100vh - 76px);

    display: flex;
    flex-direction: column;
    align-items: center;

    text-align: center;

    padding: 100px 20px 120px;
}

.badge {
    padding: 8px 16px;
    margin-bottom: 26px;

    border-radius: 999px;

    background: rgba(55,145,255,.08);
    border: 1px solid rgba(55,145,255,.25);

    color: #69b1ff;

    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
}

h1 {
    margin-bottom: 24px;

    line-height: .95;

    font-weight: 900;
    letter-spacing: -4px;
}

.blue {
    color: #4da6ff;
}

.description {
    max-width: 620px;

    margin-bottom: 36px;

    color: #8e98a8;

    font-size: 17px;
    line-height: 1.6;
}

.download {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    min-width: 150px;

    padding: 15px 30px;

    border-radius: 10px;

    background: #2388ff;
    color: white;

    text-decoration: none;

    font-size: 16px;
    font-weight: 700;

    box-shadow:

.download:hover {

/* =========================================================
   GUI PREVIEW
========================================================= */

.gui-container {
    width: 100%;

    display: flex;
    justify-content: center;

    margin-top: 80px;
}

/*
    Original C++:
    winW = 500
    winH = 600

    Die GUI bleibt exakt 500x600 auf Desktop.
*/

.gui {
    position: relative;

    width: 500px;
    height: 600px;

    background: rgba(20,20,31,.95);

    border: 1px solid rgba(51,51,77,1);

    box-shadow:
        0 35px 100px rgba(0,0,0,.7),
        0 0 100px rgba(80,50,180,.08);

    overflow: hidden;

    text-align: left;

    transform-origin: center center;

    animation:
        guiOpen .3s cubic-bezier(.22,.8,.2,1);
}

@keyframes guiOpen {
    0% {
        opacity: 0;
        transform: scale(.85);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }
}

/* =========================================================
   TITLE BAR
========================================================= */

.titlebar {
    position: absolute;

    left: 0;
    top: 0;

    width: 500px;
    height: 40px;

    align-items: center;

    padding-left: 20px;

    background: rgba(31,31,46,1);

    z-index: 5;
}

.title {

    font-weight: 600;

    text-shadow:

}

/* =========================================================
   CLOSE BUTTON
========================================================= */

.close {
    position: absolute;

    border: none;

   TABS
========================================================= */

}

/*
    C++:
    tabW = (500 - 10) / 5 = 98

.content::-webkit-scrollbar-track {

.section-header {

}

.section-line {

}

.section-title {

    left: 210px;

    font-size: 12px;

/* =========================================================
   ROW
========================================================= */

.row {
    position: relative;

}

.label {

/* =========================================================
   TOGGLE
========================================================= */

.toggle {

    top: 5px;

    width: 40px;
    height: 20px;

    background: rgba(38,26,26,1);

    cursor: pointer;

    transition:
        background .12s ease;

.toggle::after {
    content: "";

    position: absolute;

    left: 0;
    top: 0;

    border: 1px solid rgba(51,51,51,1);

}

.toggle.active {
    background: rgba(51,128,51,1);
}

.toggle.active::after {
    left: 20px;
}

/* =========================================================
   SLIDER
========================================================= */

.slider-row {
    position: relative;

    width: 470px;
    height: 40px;
}

.slider-label {
    position: absolute;

    left: 0;
    top: 13px;

    width: 180px;

    color: rgba(204,204,204,1);

    font-size: 12px;
}

.slider-wrap {
    position: absolute;

    left: 180px;
    top: 16px;

    width: 200px;
    height: 14px;
}

.slider {
    position: absolute;

    left: 0;
    top: 0;

    width: 200px;
    height: 6px;

    appearance: none;
    -webkit-appearance: none;

    background: rgba(38,38,51,1);

    outline: none;

    cursor: pointer;
}

/*
    C++:
    drawFilledRect(sliderX, sliderY,
                   sliderW, sliderH,
                   0.15, 0.15, 0.2)

    Filled section:
    0.3, 0.6, 0.9
*/

.slider::-webkit-slider-runnable-track {
    height: 6px;

    background:
        linear-gradient(
            to right,
            rgba(77,153,230,1) var(--progress, 50%),
            rgba(38,38,51,1) var(--progress, 50%)

}

.slider::-moz-range-track {
    height: 6px;

    background: rgba(38,38,51,1);
}

.slider::-moz-range-progress {

    background: rgba(77,153,230,1);
}

    -webkit-appearance: none;

    width: 12px;
    height: 14px;

    margin-top: -4px;

    background: rgba(230,230,230,1);

    border: 1px solid rgba(51,51,51,1);

    cursor: pointer;

.slider::-moz-range-thumb {
    width: 12px;
    height: 14px;

    background: rgba(230,230,230,1);

    border: 1px solid rgba(51,51,51,1);

    cursor: pointer;
}

.slider-value {

    left: 210px;

/* =========================================================
   DROPDOWN

.dropdown {

    display: flex;

    justify-content: space-between;

.dropdown:hover {

}

/* =========================================================
   COLOR PICKER
========================================================= */

.color {
    position: absolute;

    left: 160px;
    top: 5px;

    width: 50px;
    height: 20px;

    padding: 0;

    border: 1px solid rgba(51,51,77,1);

    background: transparent;

    cursor: pointer;

    appearance: none;
    -webkit-appearance: none;
}

.color::-webkit-color-swatch-wrapper {

}

.color::-webkit-color-swatch {
    border: none;
}

/* =========================================================

========================================================= */

.keybind {
    position: absolute;

    left: 160px;
    top: 4px;

    width: 100px;
    height: 22px;

    display: flex;
    align-items: center;

    padding-left: 5px;

    background: rgba(31,31,46,1);

    border: 1px solid rgba(51,51,77,1);

.keybind.waiting {

/* =========================================================
   BUTTONS
========================================================= */

.button-row {
    height: 40px;

    display: flex;
    align-items: center;

    gap: 5px;
}

.button {
    width: 100px;
    height: 30px;

/* =========================================================

.current-profile {

        padding-left: 10px;
        padding-right: 10px;
    }

<body>

<nav>

        <span>ASTRIX</span> CLIENT

<main class="hero">

        download="astrixclient.exe"

    </a>


    <div class="gui-container">

        <div class="gui">

            <!-- TITLE -->

            <div class="titlebar">

                <div class="title">
                    Astrix Client v3.0
                </div>

                <button class="close">
                    X
                </button>

            </div>


            <!-- TABS -->

            <div class="tabs">

                <button class="tab active" data-tab="combat">
                    Combat
                </button>

                <button class="tab" data-tab="movement">
                    Movement
                </button>

                <button class="tab" data-tab="render">
                    Render
                </button>

                <button class="tab" data-tab="settings">
                    Settings
                </button>

                <button class="tab" data-tab="config">
                    Config
                </button>

            </div>


            <!-- CONTENT -->

            <div class="content" id="content"></div>

        </div>

    </div>

</main>


<script>

/* =========================================================
   HELPERS
========================================================= */

function section(title, content) {

    return `
        <div class="section">

            <div class="section-header">

                <div class="section-line"></div>

                <div class="section-title">
                    ${title}
                </div>

            </div>

            ${content}

        </div>
    `;
}


function toggle(label) {

    return `
        <div class="row">

            <div class="label">
                ${label}
            </div>

            <div
                class="toggle"
                onclick="this.classList.toggle('active')"
            ></div>

        </div>
    `;
}


function slider(label, id, min, max, value, suffix = "") {

    return `
        <div class="slider-row">

            <div class="slider-label">
                ${label}
            </div>

            <div class="slider-wrap">

                <input
                    class="slider"
                    type="range"
                    min="${min}"
                    max="${max}"
                    value="${value}"
                    data-output="${id}"
                    oninput="updateSlider(this)"
                >

                <div
                    class="slider-value"
                    id="${id}"
                >
                    ${value}${suffix}
                </div>

            </div>

        </div>
    `;
}


function updateSlider(slider) {

    const output =
        document.getElementById(
            slider.dataset.output
        );

    if (!output) return;

    output.textContent =
        slider.value;

    const min =
        parseFloat(slider.min);

    const max =
        parseFloat(slider.max);

    const value =
        parseFloat(slider.value);

    const percentage =
        ((value - min) / (max - min)) * 100;

    slider.style.setProperty(
        "--progress",
        percentage + "%"
    );
}


function dropdown(label) {

    return `
        <div class="row">

            <div class="label">
                ${label}
            </div>

            <div
                class="dropdown"
                onclick="cycleDropdown(this)"
            >
                <span>Distance</span>
                <span>▼</span>
            </div>

        </div>
    `;
}


function cycleDropdown(element) {

    const values = [
        "Distance",
        "Health",
        "Angle"
    ];

    const span =
        element.querySelector("span");

    const current =
        values.indexOf(span.textContent);

    span.textContent =
        values[(current + 1) % values.length];
}


function color(label, value) {

    return `
        <div class="row">

            <div class="label">
                ${label}
            </div>

            <input
                class="color"
                type="color"
                value="${value}"
            >

        </div>
    `;
}


function keybind(label, key) {

    return `
        <div class="row">

            <div class="label">
                ${label}
            </div>

            <div
                class="keybind"
                onclick="pickKey(this)"
            >
                ${key}
            </div>

        </div>
    `;
}


function pickKey(element) {

    if (element.classList.contains("waiting")) {

        element.classList.remove("waiting");

        element.textContent = "ESC";

        return;
    }

    element.classList.add("waiting");

    element.textContent =
        "Press key...";

    const handler = function(event) {

        element.textContent =
            event.key.toUpperCase();

        element.classList.remove("waiting");

        document.removeEventListener(
            "keydown",
            handler
        );
    };

    document.addEventListener(
        "keydown",
        handler
    );
}


/* =========================================================
   COMBAT
========================================================= */

function renderCombat() {

    content.innerHTML =

        section(
            "Aimbot",

            toggle("Enable") +

            slider(
                "FOV",
                "fov",
                0,
                90,
                45
            ) +

            slider(
                "Smoothness",
                "smoothness",
                0,
                100,
                50
            ) +

            dropdown("Priority")
        )

        +

        section(
            "KillAura",

            toggle("Enable") +

            slider(
                "Range",
                "range",
                3,
                6,
                3
            ) +

            slider(
                "APS",
                "aps",
                4,
                20,
                10
            ) +

            toggle("Multi-Target") +

            toggle("Auto Weapon")
        )

        +

        section(
            "Triggerbot",

            toggle("Enable") +

            slider(
                "Delay (ms)",
                "delay",
                0,
                500,
                100
            )
        );

    initSliders();
}


/* =========================================================
   MOVEMENT
========================================================= */

function renderMovement() {

    content.innerHTML =

        section(
            "Speedwalk",

            toggle("Enable") +

            slider(
                "Multiplier",
                "multiplier",
                1,
                5,
                1
            ) +

            toggle("Ground Only") +

            toggle("Strafe Modify")
        )

        +

        section(
            "Boatfly",

            toggle("Enable") +

            slider(
                "Vertical Speed",
                "vertical",
                0,
                5,
                1
            ) +

            slider(
                "Horizontal Speed",
                "horizontal",
                0,
                3,
                1
            ) +

            toggle("Glide Mode")
        );

    initSliders();
}


/* =========================================================
   RENDER
========================================================= */

function renderRender() {

    content.innerHTML =

        section(
            "ESP",

            toggle("Enable") +

            toggle("Boxes") +

            toggle("Tracers") +

            toggle("Health Bars") +

            toggle("Names") +

            toggle("Distance")
        )

        +

        section(
            "Colors",

            color(
                "Box Color",
                "#cc3333"
            ) +

            color(
                "Tracer Color",
                "#6633cc"
            )
        );
}


/* =========================================================
   SETTINGS
========================================================= */

function renderSettings() {

    content.innerHTML =

        section(
            "Keybinds",

            keybind("Toggle GUI", "RSHIFT") +

            keybind("Aimbot", "R") +

            keybind("KillAura", "K") +

            keybind("ESP", "X") +

            keybind("Triggerbot", "T") +

            keybind("Speedwalk", "V") +

            keybind("Boatfly", "B")
        )

        +

        section(
            "Visual Settings",

            slider(
                "GUI Scale",
                "guiScale",
                50,
                150,
                100
            ) +

            toggle("Show FPS")
        );

    initSliders();
}


/* =========================================================
   CONFIG
========================================================= */

function renderConfig() {

    content.innerHTML =

        section(
            "Profile Manager",

            `
            <div class="current-profile">
                Current: default
            </div>

            <div class="button-row">

                <button
                    class="button"
                    onclick="alert('Profile gespeichert')"
                >
                    Save
                </button>

                <button
                    class="button"
                    onclick="alert('Profile geladen')"
                >
                    Load
                </button>

                <button
                    class="button"
                    onclick="alert('Neues Profil erstellt')"
                >
                    New
                </button>

            </div>

            <div class="button-row">

                <button
                    class="button"
                    onclick="alert('Profile gelöscht')"
                >
                    Delete
                </button>

                <button
                    class="button"
                    onclick="alert('Rename')"
                >
                    Rename
                </button>

                <button
                    class="button"
                    onclick="alert('Profile exportiert')"
                >
                    Export
                </button>

            </div>
            `
        )

        +

        section(
            "Profiles",

            `
            <div class="profile">
                default
            </div>

            <div class="profile">
                profile_1
            </div>

            <div class="profile">
                PvP
            </div>

            <div class="profile">
                Legit
            </div>
            `
        );
}


/* =========================================================
   SLIDER INITIALIZATION
========================================================= */

function initSliders() {

    document
        .querySelectorAll(".slider")
        .forEach(slider => {

            updateSlider(slider);

        });
}


/* =========================================================
   TAB SYSTEM
========================================================= */

const content =
    document.getElementById("content");

document
    .querySelectorAll(".tab")
    .forEach(tab => {

        tab.addEventListener(
            "click",
            function() {

                document
                    .querySelectorAll(".tab")
                    .forEach(t =>
                        t.classList.remove("active")
                    );

                this.classList.add("active");

                const selected =
                    this.dataset.tab;

                if (selected === "combat")
                    renderCombat();

                if (selected === "movement")
                    renderMovement();

                if (selected === "render")
                    renderRender();

                if (selected === "settings")
                    renderSettings();

                if (selected === "config")
