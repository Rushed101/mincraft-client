<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Astrix Client</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: #05070c;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(80, 55, 180, 0.18),
                    transparent 45%
                ),
                radial-gradient(
                    circle at 15% 80%,
                    rgba(35, 100, 255, 0.08),
                    transparent 30%
                );
        }

        nav {
            position: relative;
            z-index: 10;

            width: 100%;
            height: 76px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(5, 7, 12, 0.90);
            border-bottom: 1px solid rgba(255,255,255,.07);

            backdrop-filter: blur(12px);
        }

        .logo {
            font-size: 21px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .logo span {
            color: #4aa3ff;
        }

        .hero {
            position: relative;
            z-index: 2;

            min-height: calc(100vh - 76px);

            display: flex;
            flex-direction: column;
            align-items: center;

            text-align: center;

            padding: 100px 20px 120px;
        }

        .badge {
            display: inline-block;

            padding: 8px 16px;
            margin-bottom: 26px;

            border-radius: 999px;

            background: rgba(55,145,255,.08);
            border: 1px solid rgba(55,145,255,.25);

            color: #69b1ff;

            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        h1 {
            margin-bottom: 24px;

            font-size: clamp(48px, 9vw, 100px);
            line-height: .95;

            font-weight: 900;
            letter-spacing: -4px;
        }

        .blue {
            color: #4da6ff;
        }

        .description {
            max-width: 620px;
            margin-bottom: 36px;

            color: #8e98a8;

            font-size: 17px;
            line-height: 1.6;
        }

        .download {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-width: 150px;

            padding: 15px 30px;

            border-radius: 10px;

            background: #2388ff;
            color: white;

            text-decoration: none;

            font-size: 16px;
            font-weight: 700;

            box-shadow:
                0 10px 35px rgba(35,136,255,.25);

            transition: .25s ease;
        }

        .download:hover {
            transform: translateY(-3px);

            background: #3995ff;

            box-shadow:
                0 15px 45px rgba(35,136,255,.4);
        }


        /* =====================================================
           ASTRIX GUI
        ===================================================== */

        .gui-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 80px;
        }

        .gui {
            width: 500px;
            min-height: 600px;

            position: relative;

            background: rgba(20,20,31,.97);

            border: 1px solid rgba(80,80,110,.85);

            box-shadow:
                0 35px 100px rgba(0,0,0,.75),
                0 0 80px rgba(90,55,180,.08);

            text-align: left;

            overflow: hidden;

            transform-origin: center;
            animation: guiOpen .35s cubic-bezier(.22,.8,.2,1);
        }

        @keyframes guiOpen {
            from {
                opacity: 0;
                transform: scale(.85);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }


        /* TITLE BAR */

        .titlebar {
            height: 40px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 10px 0 20px;

            background: #1f1f2e;

            border-bottom: 1px solid rgba(255,255,255,.04);
        }

        .title {
            font-size: 13px;
            font-weight: 600;

            color: #e8e3f4;

            text-shadow:
                1px 1px 2px rgba(0,0,0,.8);
        }

        .close {
            width: 25px;
            height: 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #4d1b20;

            color: #ff6666;

            border: none;

            font-size: 12px;
            font-weight: bold;

            cursor: pointer;

            transition: .15s;
        }

        .close:hover {
            background: #70252c;
        }


        /* TABS */

        .tabs {
            height: 35px;

            display: flex;

            gap: 2px;

            padding: 0 5px;

            margin-top: 5px;
        }

        .tab {
            flex: 1;

            height: 35px;

            border: none;

            background: #17171f;

            color: #80808b;

            font-size: 11px;

            cursor: pointer;

            position: relative;

            transition: .15s;
        }

        .tab:hover {
            background: #211d2c;
            color: #aaa4b8;
        }

        .tab.active {
            background: #261a40;
            color: #cbbcff;
        }

        .tab.active::after {
            content: "";

            position: absolute;

            left: 5px;
            right: 5px;
            bottom: 0;

            height: 2px;

            background: #6633cc;
        }


        /* CONTENT */

        .content {
            height: 515px;

            padding: 15px;

            overflow-y: auto;
        }

        .content::-webkit-scrollbar {
            width: 4px;
        }

        .content::-webkit-scrollbar-track {
            background: #111119;
        }

        .content::-webkit-scrollbar-thumb {
            background: #343040;
        }


        /* SECTION */

        .section {
            margin-bottom: 12px;
        }

        .section-header {
            height: 30px;

            display: flex;
            align-items: center;

            position: relative;
        }

        .section-header::before {
            content: "";

            width: 200px;
            height: 1px;

            position: absolute;

            left: 0;
            top: 15px;

            background: rgba(100,100,130,.45);
        }

        .section-header span {
            position: relative;

            margin-left: 210px;

            white-space: nowrap;

            color: #b9b7c9;

            font-size: 12px;
            font-weight: 600;
        }


        /* ROW */

        .row {
            min-height: 30px;

            display: flex;
            align-items: center;

            position: relative;

            color: #c4c4ca;

            font-size: 12px;
        }

        .row-label {
            width: 160px;
        }


        /* TOGGLE */

        .toggle {
            width: 40px;
            height: 20px;

            position: relative;

            background: #261c1d;

            border: 1px solid #44414d;

            cursor: pointer;

            transition: .15s;
        }

        .toggle::after {
            content: "";

            position: absolute;

            left: 0;
            top: 0;

            width: 18px;
            height: 18px;

            background: #e7e7e7;

            border: 1px solid #333;

            transition: .15s;
        }

        .toggle.active {
            background: #33804a;
        }

        .toggle.active::after {
            left: 20px;
        }


        /* SLIDER */

        .slider-row {
            min-height: 40px;

            display: flex;
            align-items: center;
        }

        .slider-label {
            width: 180px;

            color: #c4c4ca;

            font-size: 12px;
        }

        .slider-container {
            width: 200px;

            position: relative;
        }

        .slider {
            width: 200px;
            height: 6px;

            appearance: none;

            background: #272731;

            outline: none;

            cursor: pointer;
        }

        .slider::-webkit-slider-thumb {
            appearance: none;

            width: 12px;
            height: 14px;

            background: #e8e8e8;

            border: 1px solid #303030;

            cursor: pointer;
        }

        .slider::-moz-range-thumb {
            width: 12px;
            height: 14px;

            background: #e8e8e8;

            border: 1px solid #303030;

            cursor: pointer;
        }

        .slider-value {
            position: absolute;

            right: -55px;
            top: -5px;

            width: 45px;

            color: #aaa7b7;

            font-size: 11px;

            text-align: right;
        }


        /* DROPDOWN */

        .dropdown {
            width: 120px;
            height: 22px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6px;

            background: #1f1f2e;

            border: 1px solid #343442;

            color: #c9c8d0;

            font-size: 11px;

            cursor: pointer;
        }

        .dropdown:hover {
            border-color: #55457a;
        }


        /* COLOR */

        .color-picker {
            width: 50px;
            height: 20px;

            background: #cc3333;

            border: 1px solid #343442;

            cursor: pointer;
        }


        /* KEYBIND */

        .keybind {
            width: 100px;
            height: 22px;

            display: flex;
            align-items: center;

            padding-left: 5px;

            background: #1f1f2e;

            border: 1px solid #343442;

            color: #aaa7b7;

            font-size: 11px;

            cursor: pointer;
        }

        .keybind:hover {
            border-color: #604d88;
        }

        .keybind.waiting {
            background: #3b194b;
            color: #d9baff;
        }


        /* BUTTONS */

        .button {
            min-width: 100px;
            height: 30px;

            padding: 0 14px;

            background: #1f172c;

            border: 1px solid #45335f;

            color: #e3e0e9;

            font-size: 11px;

            cursor: pointer;

            transition: .15s;
        }

        .button:hover {
            background: #332052;

            border-color: #6a4a96;
        }

        .button-row {
            display: flex;
            gap: 5px;

            margin-bottom: 10px;
        }


        /* PROFILE */

        .current-profile {
            margin: 5px;

            color: #aaa7b7;

            font-size: 12px;
        }

        .profile-list {
            display: flex;
            flex-direction: column;

            gap: 5px;
        }

        .profile {
            height: 25px;

            display: flex;
            align-items: center;

            padding-left: 10px;

            background: #191923;

            border: 1px solid #2f2e39;

            color: #aaa7b7;

            font-size: 11px;

            cursor: pointer;
        }

        .profile:hover {
            background: #28203b;
            border-color: #50406d;
        }


        @media (max-width: 600px) {

            .hero {
                padding-top: 70px;
            }

            .gui-wrapper {
                margin-top: 55px;
            }

            .gui {
                width: 94vw;
                min-height: 600px;
            }

            .content {
                padding: 10px;
            }

            .section-header span {
                margin-left: 130px;
            }

            .section-header::before {
                width: 125px;
            }

            .slider-label {
                width: 125px;
            }

            .row-label {
                width: 125px;
            }

            .slider-container,
            .slider {
                width: 150px;
            }
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">
        <span>ASTRIX</span> CLIENT
    </div>
</nav>


<main class="hero">

    <div class="badge">
        MINECRAFT CLIENT
    </div>

    <h1>
        Built for <span class="blue">PvP</span>
    </h1>

    <p class="description">
        Ein moderner Minecraft Client für ein schnelles,
        cleanes und flüssiges Spielerlebnis.
    </p>

    <a
        class="download"
        href="https://github.com/Rushed101/mincraft-client/raw/refs/heads/main/astrixclient.exe"
        download="astrixclient.exe"
    >
        Jetzt Holen
    </a>


    <!-- =====================================================
         ASTRIX CLICK GUI
    ====================================================== -->

    <div class="gui-wrapper">

        <div class="gui" id="gui">

            <div class="titlebar">

                <div class="title">
                    Astrix Client v3.0
                </div>

                <button
                    class="close"
                    onclick="closeGui()"
                >
                    X
                </button>

            </div>


            <div class="tabs">

                <button
                    class="tab active"
                    onclick="selectTab('combat', this)"
                >
                    Combat
                </button>

                <button
                    class="tab"
                    onclick="selectTab('movement', this)"
                >
                    Movement
                </button>

                <button
                    class="tab"
                    onclick="selectTab('render', this)"
                >
                    Render
                </button>

                <button
                    class="tab"
                    onclick="selectTab('settings', this)"
                >
                    Settings
                </button>

                <button
                    class="tab"
                    onclick="selectTab('config', this)"
                >
                    Config
                </button>

            </div>


            <div class="content" id="content"></div>

        </div>

    </div>

</main>


<script>

    const gui = document.getElementById("gui");
    const content = document.getElementById("content");


    function toggle(element) {
        element.classList.toggle("active");
    }


    function sliderValue(slider, output) {
        document.getElementById(output).textContent = slider.value;
    }


    function closeGui() {

        gui.style.animation = "none";
        gui.style.opacity = "0";
        gui.style.transform = "scale(.85)";

        setTimeout(() => {

            gui.style.opacity = "1";
            gui.style.transform = "scale(1)";
            gui.style.animation = "guiOpen .35s cubic-bezier(.22,.8,.2,1)";

        }, 500);
    }


    function keybind(element) {

        if (element.classList.contains("waiting")) {

            element.classList.remove("waiting");
            element.textContent = "ESC";

        } else {

            element.classList.add("waiting");
            element.textContent = "Press key...";

            setTimeout(() => {

                if (element.classList.contains("waiting")) {

                    element.classList.remove("waiting");
                    element.textContent = "RSHIFT";

                }

            }, 1200);

        }
    }


    function selectTab(tab, button) {

        document
            .querySelectorAll(".tab")
            .forEach(t => t.classList.remove("active"));

        button.classList.add("active");

        if (tab === "combat") {
            renderCombat();
        }

        if (tab === "movement") {
            renderMovement();
        }

        if (tab === "render") {
            renderRender();
        }

        if (tab === "settings") {
            renderSettings();
        }

        if (tab === "config") {
            renderConfig();
        }
    }


    function toggleHTML(label) {

        return `
            <div class="row">
                <div class="row-label">${label}</div>

                <div
                    class="toggle"
                    onclick="toggle(this)"
                ></div>
            </div>
        `;
    }


    function sliderHTML(label, id, min, max, value) {

        return `
            <div class="slider-row">

                <div class="slider-label">
                    ${label}
                </div>

                <div class="slider-container">

                    <input
                        class="slider"
                        type="range"
                        min="${min}"
                        max="${max}"
                        value="${value}"
                        oninput="document.getElementById('${id}').textContent=this.value"
                    >

                    <span
                        class="slider-value"
                        id="${id}"
                    >
                        ${value}
                    </span>

                </div>

            </div>
        `;
    }


    function section(title, html) {

        return `
            <div class="section">

                <div class="section-header">
                    <span>${title}</span>
                </div>

                ${html}

            </div>
        `;
    }


    function renderCombat() {

        content.innerHTML =

            section("Aimbot",

                toggleHTML("Enable") +

                sliderHTML("FOV", "fovValue", 0, 90, 45) +

                sliderHTML("Smoothness", "smoothValue", 0, 100, 50) +

                `
                <div class="row">

                    <div class="row-label">
                        Priority
                    </div>

                    <div class="dropdown">
                        Distance
                        <span>▼</span>
                    </div>

                </div>
                `
            )


            +

            section("KillAura",

                toggleHTML("Enable") +

                sliderHTML("Range", "rangeValue", 3, 6, 3) +

                sliderHTML("APS", "apsValue", 4, 20, 10) +

                toggleHTML("Multi-Target") +

                toggleHTML("Auto Weapon")
            )


            +

            section("Triggerbot",

                toggleHTML("Enable") +

                sliderHTML("Delay (ms)", "delayValue", 0, 500, 100)
            );
    }


    function renderMovement() {

        content.innerHTML =

            section("Speedwalk",

                toggleHTML("Enable") +

                sliderHTML("Multiplier", "speedValue", 1, 5, 1) +

                toggleHTML("Ground Only") +

                toggleHTML("Strafe Modify")
            )


            +

            section("Boatfly",

                toggleHTML("Enable") +

                sliderHTML("Vertical Speed", "verticalValue", 0, 5, 1) +

                sliderHTML("Horizontal Speed", "horizontalValue", 0, 3, 1) +

                toggleHTML("Glide Mode")
            );
    }


    function renderRender() {

        content.innerHTML =

            section("ESP",

                toggleHTML("Enable") +

                toggleHTML("Boxes") +

                toggleHTML("Tracers") +

                toggleHTML("Health Bars") +

                toggleHTML("Names") +

                toggleHTML("Distance")
            )


            +

            section("Colors",

                `
                <div class="row">

                    <div class="row-label">
                        Box Color
                    </div>

                    <input
                        class="color-picker"
                        type="color"
                        value="#cc3333"
                    >

                </div>

                <div class="row">

                    <div class="row-label">
                        Tracer Color
                    </div>

                    <input
                        class="color-picker"
                        type="color"
                        value="#6633cc"
                    >

                </div>
                `
            );
    }


    function renderSettings() {

        content.innerHTML =

            section("Keybinds",

                `
                <div class="row">
                    <div class="row-label">Toggle GUI</div>
                    <div class="keybind" onclick="keybind(this)">RSHIFT</div>
                </div>

                <div class="row">
                    <div class="row-label">Aimbot</div>
                    <div class="keybind" onclick="keybind(this)">R</div>
                </div>

                <div class="row">
                    <div class="row-label">KillAura</div>
                    <div class="keybind" onclick="keybind(this)">K</div>
                </div>

                <div class="row">
                    <div class="row-label">ESP</div>
                    <div class="keybind" onclick="keybind(this)">X</div>
                </div>

                <div class="row">
                    <div class="row-label">Triggerbot</div>
                    <div class="keybind" onclick="keybind(this)">T</div>
                </div>

                <div class="row">
                    <div class="row-label">Speedwalk</div>
                    <div class="keybind" onclick="keybind(this)">V</div>
                </div>

                <div class="row">
                    <div class="row-label">Boatfly</div>
                    <div class="keybind" onclick="keybind(this)">B</div>
                </div>
                `
            )


            +

            section("Visual Settings",

                sliderHTML(
                    "GUI Scale",
                    "guiScaleValue",
                    50,
                    150,
                    100
                )

                +

                toggleHTML("Show FPS")
            );
    }


    function renderConfig() {

        content.innerHTML =

            section("Profile Manager",

                `
                <div class="current-profile">
                    Current: default
                </div>

                <div class="button-row">

                    <button class="button">
                        Save
                    </button>

                    <button class="button">
                        Load
                    </button>

                    <button class="button">
                        New
                    </button>

                </div>

                <div class="button-row">

                    <button class="button">
                        Delete
                    </button>

                    <button class="button">
                        Rename
                    </button>

                    <button class="button">
                        Export
                    </button>

                </div>
                `
            )


            +

            section("Profiles",

                `
                <div class="profile-list">

                    <div class="profile">
                        default
                    </div>

                    <div class="profile">
                        PvP
                    </div>

                    <div class="profile">
                        Hypixel
                    </div>

                    <div class="profile">
                        Legit
                    </div>

                </div>
                `
            );
    }


    renderCombat();

</script>

</body>
</html>
